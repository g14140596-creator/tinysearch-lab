[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinysearch-lab"
version = "1.0.0"
description = "A small search engine built from scratch with an inverted index, BM25 ranking, SQLite, a REST API, and a CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Grace Huang" }]
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
tinysearch = "tinysearch.cli:main"

[tool.setuptools.packages.find]
include = ["tinysearch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

